name: Inject Kata Nama into themes
on:
  push:
    paths:
      - '.github/theme_kata_nama_trigger'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach theme Kata Nama renderer
        shell: python
        run: |
          from pathlib import Path
          tag='<script src="theme-kata-nama.js"></script>'
          changed=[]
          for p in sorted(Path('.').glob('t*.html')):
              s=p.read_text(encoding='utf-8')
              if tag in s: continue
              if '</body>' in s:
                  s=s.replace('</body>',tag+'\n</body>',1)
                  p.write_text(s,encoding='utf-8')
                  changed.append(p.name)
          print('updated',len(changed),changed)
      - name: Commit theme integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add t*.html
          git diff --cached --quiet && exit 0
          git commit -m "Integrate Kata Nama into T01-T30 theme pages"
          git push
