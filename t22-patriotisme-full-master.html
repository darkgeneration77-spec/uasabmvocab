<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T22 Patriotisme｜马来文词汇</title><style>body{margin:0;font:19px/1.7 system-ui,"Noto Sans SC",sans-serif;background:#fff8f2;color:#1f2430}.wrap{max-width:1280px;margin:auto;padding:24px}.hero,.section,.map{background:#fff;border:1px solid #eadfd7;border-radius:26px;margin:22px 0;box-shadow:0 14px 36px #46281918}.hero{padding:32px;background:linear-gradient(135deg,#fff,#ffe9d7)}h1{font-size:clamp(36px,6vw,68px);margin:8px 0}.btn,.badge{display:inline-block;padding:8px 13px;border:1px solid #e6c8b5;border-radius:15px;background:#fff;font-weight:800}.badges{display:flex;gap:8px;flex-wrap:wrap}.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.nav a{background:#fff;border:1px solid #eadfd7;border-radius:18px;padding:14px;text-decoration:none;color:inherit}.nav b{display:block;color:#9f3d28}.head{padding:20px 24px;border-bottom:1px solid #eadfd7}.levels{padding:16px}details{border:1px solid #eadfd7;border-radius:16px;margin:10px 0}summary{padding:15px 18px;font-weight:850;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px}.w{border:1px solid #eee3dc;border-radius:14px;padding:13px}.w b{display:block;color:#9b3d28;font-size:21px}.map{padding:22px}@media(max-width:900px){.nav,.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.nav,.grid{grid-template-columns:1fr}.wrap{padding:14px}}</style></head><body><div class="wrap"><section class="hero"><a class="btn" href="index.html">← 返回主页</a><h1>T22 Patriotisme</h1><p>爱国・国家身份・公民责任｜马来文 + 华语</p><div class="badges"><span class="badge">L1 Tahun 1–2</span><span class="badge">L2 Tahun 3–4 / MPT4</span><span class="badge">L3 Tahun 5–6 / UASA</span><span class="badge">L4 Form 1</span><span class="badge">L5 Form 2</span><span class="badge">L6 Form 3</span><span class="badge">L7 Form 4</span><span class="badge">L8 Form 5 / SPM</span></div></section><div class="nav" id="nav"></div><div id="content"></div><section class="map"><h2>Laluan Penguasaan｜成长路线</h2><p>国家象征 → 热爱国家 → 历史人物 → 国语与身份 → 团结 → 公民责任 → 国家安全 → 社会贡献 → 全球时代爱国 → SPM 论述。</p></section></div><script>const L=['L1｜Tahun 1–2','L2｜Tahun 3–4 / MPT4','L3｜Tahun 5–6 / UASA','L4｜Form 1','L5｜Form 2','L6｜Form 3','L7｜Form 4','L8｜Form 5 / SPM'];const S=[['a','Negara & Simbol Kebangsaan','国家与国家象征',['negara~国家;Malaysia~马来西亚;bendera~国旗;lagu kebangsaan~国歌','Jalur Gemilang~辉煌条纹;Negaraku~国歌《Negaraku》;bunga raya~国花;lambang negara~国家象征','Hari Kebangsaan~国庆日;Hari Malaysia~马来西亚日;Rukun Negara~国家原则;kemerdekaan~独立','simbol kebangsaan~国家象征;identiti negara~国家身份;maruah negara~国家尊严;kebanggaan~自豪感','semangat kebangsaan~国家精神;warisan negara~国家遗产;imej negara~国家形象;kesetiaan~忠诚','penghayatan Rukun Negara~理解并实践国家原则;kesetiaan kepada negara~忠于国家;menghormati simbol negara~尊重国家象征;identiti nasional~国家身份','memelihara maruah negara~维护国家尊严;memupuk semangat patriotik~培养爱国精神;memartabatkan imej negara~提升国家形象;menjaga nama baik negara~维护国家声誉','simbol negara menyatukan rakyat~国家象征凝聚人民;identiti nasional memperkukuh perpaduan~国家身份加强团结;patriotisme melalui tindakan~以行动体现爱国;penghayatan nilai kebangsaan~体会国家价值']],['b','Cinta akan Negara','热爱国家',['sayang negara~热爱国家;bangga~自豪;hormat~尊重;setia~忠诚','cinta akan negara~热爱国家;bangga menjadi rakyat Malaysia~以身为马来西亚人自豪;menjaga nama baik~维护声誉;berbakti~贡献','semangat patriotik~爱国精神;tanah air~祖国;tanggungjawab kepada negara~对国家的责任;pengorbanan~牺牲','cinta tanah air~爱国情怀;kesetiaan~忠诚;khidmat~服务;sumbangan~贡献','patriotisme~爱国精神;komitmen kepada negara~对国家的承担;memelihara keamanan~维护和平;menjaga keharmonian~维护和谐','jati diri~自我身份认同;kesanggupan berbakti~愿意贡献;semangat kekitaan~归属感;kepentingan bersama~共同利益','patriotisme melalui tindakan~以行动体现爱国;menghormati kepelbagaian~尊重多元;memperkukuh perpaduan~加强团结;mendahulukan kepentingan bersama~重视共同利益','patriotisme yang matang~成熟爱国观;membina negara melalui sumbangan~通过贡献建设国家;mempertahankan nilai kebangsaan~维护国家价值;mengekalkan keharmonian negara~维持国家和谐']],['c','Sejarah & Tokoh Negara','国家历史与人物',['sejarah~历史;tokoh~人物;pahlawan~英雄;pejuang~斗士','tokoh negara~国家人物;pejuang kemerdekaan~独立斗士;perjuangan~奋斗;kemerdekaan~独立','jasa tokoh~人物贡献;pengorbanan~牺牲;peristiwa bersejarah~历史事件;sumbangan~贡献','sejarah negara~国家历史;perjuangan kemerdekaan~独立斗争;semangat juang~奋斗精神;ketokohan~人物风范','warisan perjuangan~奋斗遗产;nilai kepimpinan~领导价值;generasi terdahulu~前人;teladan~榜样','menghargai jasa~珍惜贡献;mengambil iktibar~汲取教训;mengenang pengorbanan~缅怀牺牲;memahami sejarah~理解历史','sejarah sebagai pedoman~历史作为借鉴;tokoh sebagai teladan~人物作为榜样;kesedaran sejarah~历史意识;pengorbanan demi negara~为国牺牲','menghayati perjuangan generasi terdahulu~体会前人的奋斗;menilai sumbangan tokoh~评价人物贡献;memelihara warisan sejarah~保存历史遗产;mengambil pengajaran daripada sejarah~从历史吸取教训']],['d','Bahasa Kebangsaan & Identiti','国语与身份',['bahasa Melayu~马来文;bahasa kebangsaan~国语;bahasa rasmi~官方语言;bertutur~说话','membaca~阅读;menulis~书写;berbahasa Melayu~使用马来文;bahasa~语言','bahasa perpaduan~团结语言;bahasa ilmu~知识语言;bahasa komunikasi~沟通语言;identiti~身份','memartabatkan bahasa~提升语言地位;bahasa baku~标准语;kesantunan bahasa~语言礼貌;identiti kebangsaan~国家身份','kedudukan bahasa kebangsaan~国语地位;penggunaan bahasa yang betul~正确用语;laras bahasa~语体;budaya bahasa~语言文化','bahasa sebagai alat perpaduan~语言作为团结工具;penguasaan bahasa~语言掌握;bahasa sebagai jati diri~语言作为身份;penghormatan terhadap bahasa~尊重语言','memperkasa bahasa kebangsaan~强化国语;memartabatkan bahasa Melayu~提升马来文地位;bahasa dalam pembinaan negara~语言与国家建设;bahasa sebagai warisan~语言作为遗产','mengukuhkan identiti melalui bahasa~通过语言强化身份;memupuk kecintaan terhadap bahasa kebangsaan~培养对国语的热爱;mengembangkan penggunaan bahasa yang betul~推广正确用语;bahasa menyatukan masyarakat~语言凝聚社会']],['e','Perpaduan & Keharmonian','团结与和谐',['kawan~朋友;jiran~邻居;bersama~一起;tolong-menolong~互助','kerjasama~合作;hormat-menghormati~互相尊重;perpaduan~团结;harmoni~和谐','masyarakat berbilang kaum~多元族群社会;toleransi~包容;muafakat~共识;semangat kejiranan~邻里精神','keharmonian masyarakat~社会和谐;hubungan antara kaum~族群关系;semangat muhibah~亲善精神;persefahaman~相互理解','saling menghormati~互相尊重;prasangka~偏见;semangat kekitaan~归属感;kerjasama masyarakat~社会合作','hubungan harmoni~和谐关系;nilai toleransi~包容价值;kepercayaan~信任;kesepaduan sosial~社会凝聚','memperkukuh perpaduan~加强团结;mengelakkan perpecahan~避免分裂;mengatasi prasangka~克服偏见;membina kepercayaan~建立信任','perpaduan sebagai kekuatan negara~团结是国家力量;keharmonian sebagai asas kestabilan~和谐是稳定基础;meraikan kepelbagaian~珍视多元;membina identiti bersama~建立共同身份']],['f','Tanggungjawab Warganegara','公民责任',['patuh~遵守;beratur~排队;menjaga kebersihan~保持清洁;menolong~帮助','mematuhi peraturan~遵守规则;menjaga kemudahan awam~爱护公共设施;menjaga keamanan~维护安宁;bertanggungjawab~负责任','warganegara~公民;hak~权利;tanggungjawab~责任;kewajipan~义务','mematuhi undang-undang~遵守法律;menjaga harta awam~保护公物;menyumbang kepada masyarakat~贡献社会;tanggungjawab sivik~公民责任','kesedaran sivik~公民意识;disiplin~纪律;khidmat masyarakat~社区服务;keprihatinan sosial~社会关怀','penglibatan komuniti~社区参与;tanggungjawab bersama~共同责任;kepentingan awam~公共利益;amanah~责任与诚信','warganegara bertanggungjawab~负责任公民;melaksanakan tanggungjawab sosial~履行社会责任;menghormati undang-undang~尊重法律;memelihara kepentingan awam~维护公共利益','mengimbangi hak dan tanggungjawab~平衡权利与责任;penglibatan bermakna dalam masyarakat~有意义参与社会;tanggungjawab terhadap negara~对国家的责任;sumbangan kepada pembangunan negara~为国家发展作贡献']],['g','Kedaulatan & Keselamatan Negara','主权与国家安全',['aman~和平;selamat~安全;polis~警察;tentera~军队','keamanan~和平;keselamatan~安全;sempadan~边界;negara~国家','kedaulatan~主权;keselamatan negara~国家安全;mempertahankan negara~保卫国家;ancaman~威胁','memelihara keamanan~维护和平;menjaga keselamatan~维护安全;menghormati undang-undang~尊重法律;ketenteraman~安宁','kedaulatan negara~国家主权;pertahanan negara~国防;keselamatan rakyat~人民安全;ancaman luar~外部威胁','mempertahankan kedaulatan~捍卫主权;mengekalkan keamanan~维持和平;kerjasama keselamatan~安全合作;kesiapsiagaan~应变准备','kedaulatan sebagai asas negara~主权是国家基础;keamanan menjamin kesejahteraan~和平保障福祉;keselamatan tanggungjawab bersama~安全是共同责任;memelihara ketenteraman awam~维护公共秩序','mempertahankan kedaulatan dan keamanan~捍卫主权与和平;menolak ancaman terhadap negara~抵御国家威胁;memupuk kesedaran keselamatan~培养安全意识;keamanan menyokong pembangunan~和平支持发展']],['h','Khidmat & Sumbangan kepada Negara','服务与贡献',['membantu~帮助;berkhidmat~服务;menolong~协助;menjaga~照顾','khidmat masyarakat~社区服务;sumbangan~贡献;gotong-royong~合作劳动;sukarelawan~志愿者','kerja sukarela~志愿工作;berbakti~贡献;menyumbang masa~贡献时间;menyumbang tenaga~贡献力量','khidmat kepada masyarakat~服务社会;penglibatan masyarakat~社会参与;tanggungjawab sosial~社会责任;sumbangan kepada negara~为国家贡献','semangat sukarela~志愿精神;keprihatinan~关怀;penglibatan komuniti~社区参与;khidmat awam~公共服务','menyumbang kepakaran~贡献专长;menyertai program masyarakat~参与社区活动;membantu golongan memerlukan~帮助有需要群体;menjaga kepentingan bersama~维护共同利益','menggembleng tenaga~凝聚力量;memainkan peranan~发挥作用;menyumbang kepada pembangunan~为发展作贡献;memupuk semangat berkhidmat~培养服务精神','sumbangan individu membina masyarakat~个人贡献建设社会;khidmat masyarakat memupuk tanggungjawab~社区服务培养责任;setiap rakyat mempunyai peranan~每位人民都有角色;sumbangan berterusan membawa perubahan~持续贡献带来改变']],['i','Patriotisme dalam Era Global','全球时代的爱国',['kenal negara~认识国家;bangga~自豪;hormat~尊重;bahasa~语言','cinta negara~热爱国家;budaya tempatan~本地文化;produk tempatan~本地产品;identiti~身份','jati diri~自我身份;warisan~遗产;bahasa kebangsaan~国语;budaya kebangsaan~国家文化','pengaruh luar~外来影响;globalisasi~全球化;identiti nasional~国家身份;nilai tempatan~本土价值','cabaran globalisasi~全球化挑战;mengekalkan jati diri~保持身份认同;menghargai produk tempatan~珍惜本地产品;memelihara budaya~保护文化','bersaing secara sihat~健康竞争;terbuka kepada kemajuan~接受进步;mengekalkan nilai baik~保留良好价值;menghormati negara lain~尊重其他国家','mengimbangi kemajuan dan jati diri~平衡进步与身份;memperkukuh identiti nasional~加强国家身份;menyokong hasil tempatan~支持本地成果;memelihara warisan dalam arus perubahan~在变化中保护遗产','patriotisme tidak menolak kemajuan~爱国不等于排斥进步;kemajuan perlu selari dengan jati diri~进步需与身份认同并行;menghargai negara sambil bersikap terbuka~热爱国家同时保持开放;mengekalkan nilai kebangsaan dalam dunia global~全球环境中维护国家价值']],['j','Isu Patriotisme Form 4–5 / SPM','SPM 爱国议题',['cinta negara~热爱国家;bangga~自豪;perpaduan~团结;tanggungjawab~责任','semangat patriotik~爱国精神;kemerdekaan~独立;keamanan~和平;warisan~遗产','punca kurang semangat patriotik~爱国精神不足的原因;kesan~影响;langkah~措施;peranan keluarga~家庭角色','peranan sekolah~学校角色;peranan masyarakat~社会角色;kempen~宣传活动;pendidikan~教育','memupuk patriotisme~培养爱国精神;menghayati sejarah~体会历史;menghormati simbol negara~尊重国家象征;menjaga perpaduan~维护团结','memperkukuh jati diri~加强身份认同;menghargai sumbangan tokoh~珍惜人物贡献;menyertai aktiviti kenegaraan~参与国家活动;mengutamakan keharmonian~重视和谐','punca → kesan → langkah~原因 → 影响 → 措施;peranan individu → keluarga → sekolah → masyarakat~个人 → 家庭 → 学校 → 社会角色;contoh perlu relevan~例子需相关;huraian perlu jelas~说明需清楚','patriotisme perlu diterjemah melalui tindakan~爱国应落实于行动;perpaduan memperkukuh kestabilan negara~团结加强国家稳定;sejarah membentuk kesedaran~历史塑造意识;tanggungjawab rakyat menyokong pembangunan~人民责任支持国家发展']]];const nav=document.getElementById('nav'),content=document.getElementById('content');S.forEach(s=>{nav.insertAdjacentHTML('beforeend',`<a href="#${s[0]}"><b>T22-${s[0].toUpperCase()}</b>${s[1]}<br>${s[2]}</a>`);let d='';s[3].forEach((g,i)=>d+=`<details ${i===0?'open':''}><summary>${L[i]}</summary><div class="grid">${g.split(';').map(x=>{let a=x.split('~');return `<div class="w"><b>${a[0]}</b>${a[1]}</div>`}).join('')}</div></details>`);content.insertAdjacentHTML('beforeend',`<section class="section" id="${s[0]}"><div class="head"><h2>T22-${s[0].toUpperCase()}｜${s[1]}</h2><div>${s[2]}</div></div><div class="levels">${d}</div></section>`)});</script></body></html>
