name: BM Vocabulary QA

on:
  push:
    paths:
      - '.github/scripts/bm_vocab_qa.py'
      - '.github/workflows/bm-vocab-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run vocabulary QA
        run: python .github/scripts/bm_vocab_qa.py
      - name: Commit corrections
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html t*.html
          git commit -m "Second-pass QA T01-T30 vocabulary"
          git push
