<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T23 Nilai Murni｜马来文词汇</title><style>body{margin:0;font:19px/1.7 system-ui,"Noto Sans SC",sans-serif;background:#fff8f2;color:#1f2430}.wrap{max-width:1280px;margin:auto;padding:24px}.hero,.section,.map{background:#fff;border:1px solid #eadfd7;border-radius:26px;margin:22px 0;box-shadow:0 14px 36px #46281918}.hero{padding:32px;background:linear-gradient(135deg,#fff,#ffe9d7)}h1{font-size:clamp(36px,6vw,68px);margin:8px 0}.btn,.badge{display:inline-block;padding:8px 13px;border:1px solid #e6c8b5;border-radius:15px;background:#fff;font-weight:800}.badges{display:flex;gap:8px;flex-wrap:wrap}.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.nav a{background:#fff;border:1px solid #eadfd7;border-radius:18px;padding:14px;text-decoration:none;color:inherit}.nav b{display:block;color:#9f3d28}.head{padding:20px 24px;border-bottom:1px solid #eadfd7}.levels{padding:16px}details{border:1px solid #eadfd7;border-radius:16px;margin:10px 0}summary{padding:15px 18px;font-weight:850;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px}.w{border:1px solid #eee3dc;border-radius:14px;padding:13px}.w b{display:block;color:#9b3d28;font-size:21px}.map{padding:22px}@media(max-width:900px){.nav,.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.nav,.grid{grid-template-columns:1fr}.wrap{padding:14px}}</style></head><body><div class="wrap"><section class="hero"><a class="btn" href="index.html">← 返回主页</a><h1>T23 Nilai Murni</h1><p>道德价值・品格・行为判断｜马来文 + 华语</p><div class="badges"><span class="badge">L1 Tahun 1–2</span><span class="badge">L2 Tahun 3–4 / MPT4</span><span class="badge">L3 Tahun 5–6 / UASA</span><span class="badge">L4 Form 1</span><span class="badge">L5 Form 2</span><span class="badge">L6 Form 3</span><span class="badge">L7 Form 4</span><span class="badge">L8 Form 5 / SPM</span></div></section><div class="nav" id="nav"></div><div id="content"></div><section class="map"><h2>Laluan Penguasaan｜成长路线</h2><p>礼貌尊重 → 关怀 → 责任 → 诚实诚信 → 合作 → 纪律坚持 → 勇气自信 → 包容与公平 → 道德判断 → SPM 价值论述。</p></section></div><script>const L=['L1｜Tahun 1–2','L2｜Tahun 3–4 / MPT4','L3｜Tahun 5–6 / UASA','L4｜Form 1','L5｜Form 2','L6｜Form 3','L7｜Form 4','L8｜Form 5 / SPM'];const S=[['a','Hormat & Sopan Santun','尊重与礼貌',['hormat~尊重;sopan~有礼貌;baik~良好;tertib~有秩序','sopan santun~礼貌;berbudi bahasa~有礼貌懂礼节;hormat-menghormati~互相尊重;bertatasusila~有礼节','kesantunan~礼貌修养;adab~礼仪;berhemah~有分寸;berbahasa sopan~用语礼貌','menghormati orang tua~尊敬长辈;menghargai orang lain~珍惜他人;menjaga tutur kata~注意言辞;tingkah laku sopan~礼貌行为','kesantunan berbahasa~语言礼貌;hormat terhadap perbezaan~尊重差异;adab dalam masyarakat~社会礼仪;maruah~尊严','budaya hormat~尊重文化;kepekaan terhadap perasaan orang lain~顾及他人感受;kesopanan dalam komunikasi~沟通礼貌;menjaga maruah~维护尊严','memupuk budaya saling menghormati~培养互相尊重文化;berinteraksi secara berhemah~有分寸地互动;menjadi teladan kesantunan~成为礼貌榜样;menghormati kepelbagaian~尊重多元','kesantunan membina hubungan baik~礼貌建立良好关系;menghormati perbezaan tanpa menghina~尊重差异而不贬低;bahasa santun mencerminkan keperibadian~礼貌语言体现人格;adab perlu diamalkan dalam semua keadaan~任何情境都应有礼']],['b','Baik Hati & Prihatin','善良与关怀',['baik hati~善良;menolong~帮助;prihatin~关心;sayang~关爱','murah hati~慷慨;penyayang~有爱心;ambil berat~关心;membantu~帮助','simpati~同情;empati~同理心;keprihatinan~关怀;belas kasihan~怜悯','menghulurkan bantuan~伸出援手;membantu yang memerlukan~帮助有需要者;peka terhadap masalah~留意问题;menunjukkan kasih sayang~表达关爱','sikap prihatin~关怀态度;semangat kemanusiaan~人文精神;sokongan moral~精神支持;kebajikan~福祉','empati terhadap orang lain~同理他人;keprihatinan masyarakat~社会关怀;budaya membantu~互助文化;tanggungjawab kemanusiaan~人道责任','memupuk masyarakat penyayang~培养关爱社会;menyantuni golongan yang memerlukan~关怀有需要群体;mengutamakan kebajikan~重视福祉;memperkukuh sokongan masyarakat~加强社会支持','empati mendorong tindakan baik~同理心推动善行;keprihatinan membina masyarakat sejahtera~关怀建设安康社会;nilai kemanusiaan merentas perbezaan~人文价值超越差异;membantu perlu dilakukan dengan ikhlas~帮助应出于真诚']],['c','Tanggungjawab & Amanah','责任与可信赖',['tanggungjawab~责任;amanah~可信赖;janji~承诺;tugas~任务','menepati janji~守信;melaksanakan tugas~执行任务;bertanggungjawab~负责任;menjaga barang~保管物品','memikul tanggungjawab~承担责任;menunaikan amanah~履行托付;komitmen~投入;kewajipan~义务','bertanggungjawab terhadap tindakan~对行为负责;menjaga kepercayaan~维护信任;melaksanakan kewajipan~履行义务;amanah dalam tugas~履职守信','tanggungjawab sosial~社会责任;amanah kepimpinan~领导责任;kepercayaan~信任;disiplin~纪律','tanggungjawab bersama~共同责任;menjaga amanah~守住托付;bertanggungjawab kepada masyarakat~对社会负责;melaksanakan tugas dengan baik~认真履职','memikul tanggungjawab bersama~共同承担责任;menunaikan amanah dengan jujur~诚实履责;membina kepercayaan melalui tindakan~以行动建立信任;mengutamakan tanggungjawab~重视责任','amanah perlu dibuktikan melalui tindakan~诚信需以行动证明;tanggungjawab bukan sekadar janji~责任不只是承诺;kepercayaan dibina secara berterusan~信任持续建立;setiap tindakan mempunyai tanggungjawab~每项行为都有责任']],['d','Kejujuran & Integriti','诚实与诚信',['jujur~诚实;benar~真实;tidak menipu~不欺骗;ikhlas~真诚','bercakap benar~说实话;jujur dalam tindakan~行为诚实;amanah~可信赖;ikhlas membantu~真诚帮助','kejujuran~诚实;integriti~诚信;ketulusan~真诚;kepercayaan~信任','berpegang pada kebenaran~坚持真相;tidak menyalahgunakan kepercayaan~不滥用信任;bersikap telus~保持透明;prinsip~原则','nilai integriti~诚信价值;ketelusan~透明;etika~伦理;kejujuran dalam pembelajaran~学习诚信','integriti diri~个人诚信;amanah awam~公共信任;penyalahgunaan kuasa~滥用权力;konflik kepentingan~利益冲突','memperkukuh budaya integriti~强化诚信文化;menolak rasuah~拒绝贪腐;bertindak berasaskan prinsip~按原则行事;menjaga kepercayaan masyarakat~维护社会信任','integriti menjadi asas kepercayaan~诚信是信任基础;kejujuran membina keyakinan jangka panjang~诚实建立长期信任;prinsip tidak wajar dikompromi demi kepentingan diri~原则不应为私利妥协;budaya integriti bermula daripada individu~诚信文化始于个人']],['e','Kerjasama & Tolong-menolong','合作与互助',['kerjasama~合作;tolong-menolong~互助;bersama~一起;kumpulan~小组','bekerjasama~合作;gotong-royong~合作劳动;membantu rakan~帮助朋友;berkongsi tugas~分担任务','semangat kerjasama~合作精神;muafakat~共识;tanggungjawab bersama~共同责任;saling membantu~互助','berganding bahu~携手合作;pembahagian tugas~任务分配;kerja berpasukan~团队合作;persefahaman~相互理解','semangat berpasukan~团队精神;penyelarasan~协调;komunikasi berkesan~有效沟通;saling mempercayai~互相信任','kerjasama erat~紧密合作;matlamat bersama~共同目标;mencapai kata sepakat~达成共识;mengurus perbezaan pendapat~处理意见分歧','menggembleng tenaga~凝聚力量;memperkukuh kerjasama~加强合作;mengutamakan kepentingan bersama~重视共同利益;berbincang secara terbuka~坦诚讨论','kerjasama meningkatkan keberkesanan~合作提升成效;muafakat mengurangkan konflik~共识减少冲突;matlamat bersama memerlukan kepercayaan~共同目标需要信任;pembahagian tugas membantu kelancaran kerja~分工促进顺利完成']],['f','Disiplin & Ketekunan','纪律与坚持',['rajin~勤劳;disiplin~纪律;tekun~勤奋;patuh~遵守','menepati masa~守时;mematuhi peraturan~遵守规则;rajin belajar~勤奋学习;tidak mudah putus asa~不轻易放弃','ketekunan~坚持;usaha berterusan~持续努力;komitmen~投入;daya tahan~坚持力','disiplin diri~自律;gigih~勤勉;tabah~坚韧;fokus~专注','pengurusan masa~时间管理;ketahanan diri~自我韧性;kecekalan~坚毅;usaha konsisten~持续努力','pengawalan diri~自我控制;ketabahan menghadapi cabaran~面对挑战的坚韧;mengekalkan usaha~保持努力;bangkit semula~重新振作','membina disiplin kendiri~建立自律;ketekunan membawa kecemerlangan~坚持带来卓越;bangkit daripada kegagalan~从失败中站起来;mengurus masa dengan baik~良好管理时间','disiplin menjadi asas pencapaian~纪律是成就基础;ketekunan membantu mengatasi kesukaran~坚持帮助克服困难;kejayaan memerlukan konsistensi~成功需要持续性;daya tahan penting ketika menghadapi perubahan~韧性有助面对变化']],['g','Keberanian & Keyakinan','勇气与自信',['berani~勇敢;yakin~有信心;tidak takut~不害怕;bercakap benar~说实话','keyakinan~信心;berani mencuba~敢于尝试;berani bertanya~敢于提问;berani mengaku salah~敢于认错','yakin pada diri~相信自己;berani menghadapi cabaran~勇敢面对挑战;teguh~坚定;tidak mudah menyerah~不轻易放弃','keyakinan diri~自信;ketegasan~坚定;pendirian~立场;keberanian moral~道德勇气','berpendirian~有立场;tegas~坚定;berprinsip~有原则;berani menyuarakan pendapat~敢于表达意见','mempertahankan kebenaran~坚持真相;berani bertanggungjawab~勇于负责;membuat keputusan~作决定;percaya pada kebolehan diri~相信自身能力','berani menolak perkara salah~敢于拒绝错误行为;mempertahankan prinsip~坚持原则;keyakinan disertai pertimbangan~自信应伴随判断;tegas tanpa bersikap kasar~坚定但不粗鲁','keberanian bukan tindakan melulu~勇敢不等于鲁莽;keyakinan perlu dibina melalui usaha~自信需靠努力建立;pendirian perlu berdasarkan nilai yang baik~立场需基于正确价值;berani mengakui kesilapan menunjukkan kematangan~敢于认错体现成熟']],['h','Toleransi, Empati & Keadilan','包容、同理与公平',['sabar~耐心;adil~公平;berkongsi~分享;memahami~理解','bertolak ansur~互相迁就;hormat perbezaan~尊重差异;adil kepada semua~公平对待;memahami perasaan~理解感受','toleransi~包容;empati~同理心;keadilan~公平;tidak pilih kasih~不偏袒','menghormati pandangan orang lain~尊重他人意见;bertimbang rasa~体谅;melayan secara adil~公平对待;mengelakkan prasangka~避免偏见','hak orang lain~他人权利;kesaksamaan~公平对待;perbezaan pendapat~意见差异;prasangka~偏见','kepekaan terhadap perasaan~顾及感受;keadilan dalam keputusan~决定中的公平;sikap terbuka~开放态度;hormat terhadap kepelbagaian~尊重多元','membina masyarakat yang adil~建设公平社会;mengurangkan diskriminasi~减少歧视;mengutamakan pertimbangan adil~重视公平考量;memupuk empati~培养同理心','toleransi tidak bermaksud menerima perkara salah~包容不等于接受错误;keadilan memerlukan pertimbangan yang wajar~公平需要合理判断;empati membantu memahami keadaan orang lain~同理帮助理解他人处境;hormat perbezaan mengukuhkan keharmonian~尊重差异加强和谐']],['i','Etika & Pertimbangan Moral','伦理与道德判断',['baik~好;buruk~坏;betul~对;salah~错','pilihan baik~好的选择;perbuatan salah~错误行为;fikir dahulu~先思考;akibat~后果','nilai~价值;pertimbangan~考量;tanggungjawab~责任;kesan tindakan~行为影响','membuat pertimbangan~作出判断;memilih tindakan yang betul~选择正确行为;menilai akibat~评估后果;memikirkan orang lain~考虑他人','etika~伦理;prinsip~原则;keputusan bermoral~道德决定;kepentingan bersama~共同利益','pertimbangan wajar~合理考量;kesan kepada pihak lain~对他方影响;tanggungjawab terhadap keputusan~对决定负责;nilai kemanusiaan~人文价值','membuat keputusan berasaskan nilai~基于价值作决定;mempertimbangkan baik buruk~衡量利弊;menjaga hak orang lain~维护他人权利;bertindak secara bertanggungjawab~负责任行动','pertimbangan moral memerlukan alasan yang munasabah~道德判断需合理理由;keputusan baik mengambil kira kesan kepada orang lain~好的决定考虑他人影响;prinsip perlu diterapkan dalam tindakan~原则需落实于行动;nilai murni membimbing pilihan~美德指导选择']],['j','Isu Nilai Murni Form 4–5 / SPM','SPM 价值议题',['nilai murni~美德;baik~良好;hormat~尊重;tanggungjawab~责任','jujur~诚实;amanah~可信赖;kerjasama~合作;disiplin~纪律','kepentingan nilai murni~美德的重要性;kesan kurang nilai~缺乏美德的影响;cara memupuk~培养方法;peranan keluarga~家庭角色','peranan sekolah~学校角色;peranan masyarakat~社会角色;teladan~榜样;pendidikan~教育','memupuk budaya baik~培养良好风气;mengukuhkan integriti~加强诚信;menggalakkan sikap prihatin~鼓励关怀;memupuk tanggungjawab~培养责任','membentuk sahsiah terpuji~塑造良好品格;mewujudkan masyarakat harmoni~建设和谐社会;mengurangkan gejala negatif~减少负面现象;meningkatkan kepercayaan~提升信任','punca → kesan → langkah~原因 → 影响 → 措施;nilai → tindakan → kesan~价值 → 行动 → 影响;contoh perlu relevan~例子需相关;huraian perlu jelas~说明需清楚','nilai murni perlu diamalkan bukan sekadar diketahui~美德需实践不只认识;keluarga dan sekolah membentuk amalan nilai~家庭与学校共同塑造价值;masyarakat berintegriti membina kepercayaan~诚信社会建立信任;nilai baik menyokong kesejahteraan bersama~良好价值支持共同福祉']]];const nav=document.getElementById('nav'),content=document.getElementById('content');S.forEach(s=>{nav.insertAdjacentHTML('beforeend',`<a href="#${s[0]}"><b>T23-${s[0].toUpperCase()}</b>${s[1]}<br>${s[2]}</a>`);let d='';s[3].forEach((g,i)=>d+=`<details ${i===0?'open':''}><summary>${L[i]}</summary><div class="grid">${g.split(';').map(x=>{let a=x.split('~');return `<div class="w"><b>${a[0]}</b>${a[1]}</div>`}).join('')}</div></details>`);content.insertAdjacentHTML('beforeend',`<section class="section" id="${s[0]}"><div class="head"><h2>T23-${s[0].toUpperCase()}｜${s[1]}</h2><div>${s[2]}</div></div><div class="levels">${d}</div></section>`)});</script></body></html>
