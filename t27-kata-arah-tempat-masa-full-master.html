gik~位置便利／重要地点','kawasan pembangunan~发展地区;zon perindustrian~工业区;kawasan rekreasi~休闲区;lokasi geografi~地理位置','menghubungkan tempat dengan fungsi~把地点与功能联系;menilai kesesuaian lokasi~评估地点适合度;menerangkan lokasi dengan tepat~准确说明地点;menggunakan nama tempat secara betul~正确使用地点名称']],['d','Jarak & Pergerakan','距离与移动',['dekat~近;jauh~远;pergi~去;datang~来','bergerak~移动;berjalan~步行;menuju~朝向;melintas~横过','jarak~距离;laluan~路线;perjalanan~旅程;hala~方向','berpindah~移动位置;merentasi~穿越;melalui~经过;menuju ke~前往','jarak dekat~短距离;jarak jauh~长距离;laluan alternatif~替代路线;arah perjalanan~行进方向','tempoh perjalanan~行程时间;pergerakan~移动;hubungan lokasi~地点联系;akses~到达条件','ketersampaian~可达性;rangkaian laluan~路线网络;jarak relatif~相对距离;perjalanan harian~日常通行','menerangkan laluan secara berurutan~按顺序说明路线;membandingkan jarak dan masa~比较距离与时间;memilih laluan yang sesuai~选择合适路线;menggunakan arah bersama jarak~方向与距离结合使用']],['e','Masa Harian','日常时间',['pagi~早上;tengah hari~中午;petang~下午;malam~晚上','hari ini~今天;semalam~昨天;esok~明天;sekarang~现在','awal~早;lewat~迟;tepat pada masanya~准时;sebentar~一会儿','pada waktu pagi~在早上;pada sebelah petang~在下午;pada waktu malam~在晚上;sepanjang hari~全天','masa lapang~空闲时间;waktu rehat~休息时间;waktu operasi~营业时间;waktu puncak~高峰时段','jadual harian~日程;masa terluang~空余时间;masa belajar~学习时间;masa bekerja~工作时间','pengurusan masa~时间管理;ketepatan masa~守时;pengagihan masa~时间分配;keutamaan masa~时间优先安排','mengurus masa mengikut keutamaan~按优先事项管理时间;menepati masa~守时;menyusun jadual dengan baik~妥善安排日程;menyesuaikan masa dengan tugas~按任务安排时间']],['f','Urutan Masa','时间顺序',['mula-mula~首先;kemudian~然后;selepas itu~之后;akhirnya~最后','sebelum~之前;selepas~之后;ketika~当……时;semasa~在……期间','pada mulanya~起初;tidak lama kemudian~不久后;seterusnya~接下来;pada akhirnya~最终','sejurus selepas~紧接之后;sementara itu~与此同时;sebelum itu~此前;kemudiannya~后来','pada peringkat awal~初期;pada peringkat seterusnya~下一阶段;serentak~同时;secara beransur-ansur~逐步','sepanjang tempoh~整个期间;dalam tempoh tersebut~该期间;selepas beberapa ketika~过了一段时间;hingga kini~截至目前','kronologi~时间顺序;urutan peristiwa~事件顺序;fasa~阶段;tempoh peralihan~过渡期','menyusun peristiwa mengikut kronologi~按时序排列事件;membezakan urutan masa dengan sebab-akibat~区分时序与因果;gunakan penanda masa dengan tepat~准确使用时间连接语;huraikan proses mengikut fasa~按阶段说明过程']],['g','Tempoh & Kekerapan','时长与频率',['lama~久;sebentar~短暂;selalu~常常;kadang-kadang~有时','setiap hari~每天;setiap minggu~每周;sekali~一次;dua kali~两次','kerap~频繁;jarang~少见;berulang kali~多次;sepanjang~整个期间','tempoh~时长;kekerapan~频率;secara berkala~定期;sekali-sekala~偶尔','jangka masa~时间跨度;tempoh singkat~短期;tempoh panjang~长期;berterusan~持续','selang masa~间隔;berkala~周期性;bermusim~季节性;berulang~重复','kekerapan tinggi~高频率;kekerapan rendah~低频率;tempoh berpanjangan~长期持续;tempoh terhad~有限期限','membezakan kekerapan dengan tempoh~区分频率与时长;menyatakan unit masa dengan jelas~明确时间单位;menggunakan berterusan untuk tindakan tanpa putus~持续动作用 berterusan;menilai kesan mengikut tempoh dan kekerapan~按时长与频率评估影响']],['h','Masa Formal','正式时间表达',['tarikh~日期;hari~天;minggu~星期;bulan~月份','tempoh~期间;jadual~时间表;masa mula~开始时间;masa tamat~结束时间','dalam masa~在……时间内;sejak~自从;hingga~直到;selama~长达','pada tarikh~在某日期;dalam tempoh~在期间;sepanjang tempoh~整个期间;sehingga kini~截至目前','jangka pendek~短期;jangka sederhana~中期;jangka panjang~长期;tempoh pelaksanaan~执行期','tarikh akhir~截止日期;tempoh pemantauan~监测期;fasa pelaksanaan~执行阶段;tempoh kajian~研究期间','garis masa~时间线;jadual pelaksanaan~实施时间表;tempoh sasaran~目标期限;peringkat pelaksanaan~实施阶段','menggunakan sejak dengan tepat~准确使用 sejak;menggunakan selama untuk tempoh~用 selama 表示时长;menyatakan tarikh dengan jelas~清楚写日期;mengekalkan istilah masa yang konsisten~保持时间术语一致']],['i','Frasa Lokasi dalam Karangan','作文地点表达',['di rumah~在家;di sekolah~在学校;di taman~在公园;di kampung~在乡村','di kawasan sekolah~在校园;di tempat awam~在公共场所;di sekitar rumah~在住家周围;di pusat bandar~在市中心','di kawasan perumahan~在住宅区;di tepi jalan~在路旁;di kawasan rekreasi~在休闲区;di luar bandar~在乡区','berhampiran dengan~靠近;terletak di~位于;bersebelahan dengan~毗邻;di antara~在……之间','di kawasan tumpuan~在人流集中区;di lokasi kejadian~在事发地点;di kawasan setempat~在当地;di persekitaran sekolah~在校园环境','di kawasan yang sesuai~在合适地点;di lokasi yang selamat~在安全地点;di kawasan awam~在公共区域;di kawasan berhampiran~在邻近区域','pemilihan lokasi~地点选择;kedudukan strategik~便利位置;kemudahan setempat~当地设施;akses ke lokasi~前往地点的便利性','gunakan frasa tempat untuk memberi konteks~用地点短语交代情境;elakkan pengulangan di kawasan~避免重复 di kawasan;pilih kata lokasi mengikut fungsi~按功能选择地点词;pastikan kata sendi di dipisahkan daripada kata tempat~介词 di 与地点词分写']],['j','Penggunaan Aras Tinggi Form 4–5','Form 4–5 综合运用',['arah~方向;tempat~地点;masa~时间;jarak~距离','lokasi~位置;tempoh~时长;urutan~顺序;kekerapan~频率','lokasi kejadian~事发地点;tempoh masa~时间段;urutan peristiwa~事件顺序;jarak perjalanan~行程距离','menerangkan kronologi~说明时序;menghuraikan lokasi~描述地点;menyatakan tempoh~说明时长;membandingkan jarak~比较距离','menghubungkan masa dan peristiwa~连接时间与事件;menentukan lokasi yang sesuai~确定合适地点;menjelaskan perubahan mengikut masa~说明随时间变化;menyusun maklumat secara kronologi~按时序组织信息','dalam jangka pendek~短期内;dalam jangka panjang~长期内;sepanjang tempoh tersebut~在该期间;di kawasan berkenaan~在有关地区','lokasi mempengaruhi akses~地点影响通达性;tempoh mempengaruhi kesan~时长影响结果;kekerapan mempengaruhi corak~频率影响模式;urutan membantu kejelasan~顺序提升清晰度','gunakan kata arah, tempat dan masa secara tepat~准确使用方向地点时间词;pastikan kata sendi nama betul~确保介词正确;elakkan ungkapan yang kabur~避免含糊表达;susun maklumat mengikut konteks~按情境组织信息']]];const nav=document.getElementById('nav'),content=document.getElementById('content');S.forEach(s=>{nav.insertAdjacentHTML('beforeend',`<a href="#${s[0]}"><b>T27-${s[0].toUpperCase()}</b>${s[1]}<br>${s[2]}</a>`);let d='';s[3].forEach((g,i)=>d+=`<details ${i===0?'open':''}><summary>${L[i]}</summary><div class="grid">${g.split(';').map(x=>{let a=x.split('~');return `<div class="w"><b>${a[0]}</b>${a[1]}</div>`}).join('')}</div></details>`);content.insertAdjacentHTML('beforeend',`<section class="section" id="${s[0]}"><div class="head"><h2>T27-${s[0].toUpperCase()}｜${s[1]}</h2><div>${s[2]}</div></div><div class="levels">${d
