</head><body><div class="wrap"><section class="hero"><div class="topbar"><a class="btn" href="index.html">← 返回主页</a><span class="badge">Tahun 1 → Tingkatan 5</span></div><h1>T29 Sinonim & Antonim</h1><p>近义词・反义词・语义强弱・语境辨析｜马来文 + 华语｜Tahun 1 → MPT4 → UASA → Tingkatan 1–5 / SPM</p></section><div class="navgrid" id="nav"></div><div id="content"></div><section class="mastermap"><h2>Laluan Penguasaan｜成长路线</h2><p>从简单同义、近义和反义关系，逐步学习语义强弱、词语搭配与上下文选择。相近意思不代表任何句子都可以互换；“≈”表示意义接近但并非完全相同。</p></section><div class="footer">T29｜Sinonim & Antonim｜马来文 + 华语</div></div><script>

 d|Sinonim Kata Adjektif|形容词近义辨析|cantik ≈ indah~漂亮／优美;cepat = pantas~快;penat = letih~累;gembira ≈ riang~开心／欢快|pandai ≈ bijak~聪明;marah ≈ geram~生气／气恼;sunyi ≈ sepi~寂静;kemas ≈ rapi~整齐|rajin ≈ tekun~勤奋／坚持;tabah = cekal~坚韧;baik ≈ bagus~好;tenang ≈ tenteram~平静|sukar = sulit~困难;penting = mustahak~重要;rapat ≈ erat~亲近紧密;kuat ≈ kukuh~强／稳固，搭配不同|jelas ≈ nyata~清楚／明显;tepat ≈ jitu~准确;stabil ≈ mantap~稳定扎实;serius ≈ berat~严重，依语境|luas ≠ lapang~广与宽敞语境不同;halus ≠ lembut~细致与柔软不是完全同义;keras ≠ tegas~硬与坚定不可随意互换;cerah ≈ terang~明亮|berkesan ≈ mujarab~有效，mujarab多用于药物或方法;sesuai ≈ serasi~合适／协调;utama ≠ penting~主要与重要不同;menyeluruh ≠ lengkap~全面与完整不同|kata adjektif ikut kata nama~形容词须配合名词;hubungan erat~关系紧密;bangunan kukuh~建筑稳固;suara kuat~声音响亮

 f|Antonim Kontekstual|语境反义词|masuk ↔ keluar~进入 ↔ 离开;naik ↔ turun~上 ↔ 下;buka ↔ tutup~开 ↔ 关;datang ↔ pergi~来 ↔ 去|terima ↔ tolak~接受 ↔ 拒绝;mula ↔ tamat~开始 ↔ 结束;hadir ↔ tidak hadir~出席 ↔ 缺席;hidup ↔ mati~生 ↔ 死|berjaya ↔ gagal~成功 ↔ 失败;selamat ↔ berbahaya~安全 ↔ 危险;bersatu ↔ berpecah~团结 ↔ 分裂;aman ↔ kacau-bilau~安宁 ↔ 混乱|memelihara ↔ mengabaikan~维护 ↔ 忽视;menambah ↔ mengurangkan~增加 ↔ 减少;menggalakkan ↔ menghalang~鼓励 ↔ 阻碍;memperkukuh ↔ melemahkan~加强 ↔ 削弱|meningkat ↔ menurun~上升 ↔ 下降;maju ↔ mundur~进步 ↔ 落后;pulih ↔ merosot~恢复 ↔ 恶化;stabil ↔ tidak stabil~稳定 ↔ 不稳定|adil ↔ berat sebelah~公平 ↔ 偏袒;jujur ↔ tidak jujur~诚实 ↔ 不诚实;bertanggungjawab ↔ cuai~负责任 ↔ 疏忽;terbuka ↔ tertutup~开放 ↔ 封闭|inklusif ↔ eksklusif~包容广泛 ↔ 排他限定;telus ↔ tidak telus~透明 ↔ 不透明;rasional ↔ tidak rasional~理性 ↔ 不理性;produktif ↔ tidak produktif~有成效 ↔ 无成效|antonim mesti ikut konteks ayat~反义词须看句子;kata dasar dan kata berimbuhan jangan dicampur sesuka hati~不要随意混搭词根与派生词;pilih lawan makna yang paling tepat~选择最准确反义;semak fungsi kata~检查词性功能
 g|Tahap Keamatan Makna|语义强度|suka → sangat suka~喜欢 → 很喜欢;marah → sangat marah~生气 → 很生气;sedih → sangat sedih~伤心 → 很伤心;penat → sangat penat~累 → 很累|gembira → riang gembira~高兴 → 欢欣;takut → gentar~害怕 → 畏惧;risau → bimbang~担心 → 忧虑;marah → berang~生气 → 愤怒|baik → sangat baik~好 → 很好;besar → sangat besar~大 → 很大;cepat → sangat pantas~快 → 非常迅速;sukar → amat sukar~困难 → 非常困难|sedih → pilu~悲伤 → 悲痛;kecewa → hampa~失望 → 强烈失望;takut ≠ cemas~害怕与焦急不是同一维度;marah ≈ geram~生气与气恼语感不同|penting → amat penting~重要 → 非常重要;serius → sangat serius~严重 → 非常严重;luas → sangat luas~广 → 非常广;kuat → amat kuat~强 → 非常强|lemah → sangat lemah~弱 → 非常弱;stabil → lebih stabil~稳定 → 更稳定;jelas → semakin jelas~清楚 → 越来越清楚;ketara → sangat ketara~明显 → 非常明显|keamatan boleh dibina dengan sangat, amat, sungguh~可用程度副词构建强度;tidak semua sinonim ialah skala kekuatan~并非所有近义词都属强弱等级;bezakan emosi yang berlainan jenis~区分不同类型情绪;elakkan skala palsu~避免制造错误强度阶梯|pilih kata berdasarkan nuansa~按语气细微差异选词;gunakan penguat yang sesuai~使用合适程度副词;elakkan penguat berganda yang janggal~避免不自然重复加强;pastikan maksud tidak berubah~确保意思不被改变
 h|Kolokasi & Ketepatan Sinonim|搭配与近义词准确性|air jernih~清澈的水;suara kuat~响亮声音;rumah besar~大房子;jalan sempit~狭窄道路|hubungan erat~紧密关系;kawan rapat~亲密朋友;bangunan kukuh~坚固建筑;pendirian teguh~坚定立场|hujan lebat~大雨;angin kencang~强风;bau busuk~臭味;rasa pahit~苦味|menangani masalah~处理问题;menyelesaikan masalah~解决问题;mencegah penyakit~预防疾病;mengurangkan risiko~降低风险|memelihara budaya~维护文化;memulihara warisan~保育遗产;melindungi pengguna~保护消费者;menjaga kebersihan~保持卫生|meningkatkan kesedaran~提高意识;memperkukuh hubungan~加强关系;menggalakkan penyertaan~鼓励参与;memupuk nilai murni~培养美德|mewujudkan peluang~创造机会;mencapai matlamat~达成目标;mengambil langkah~采取措施;memainkan peranan~发挥作用|sinonim mesti diuji melalui kolokasi~近义词要用搭配检验;kata yang betul boleh jadi janggal jika pasangan salah~单词没错搭配也可能错;utamakan bentuk yang lazim~优先自然常用搭配;ketepatan lebih penting daripada kata panjang~准确比词长更重要
 i|Pemilihan Kata dalam Karangan|作文选词|baik ≈ bagus mengikut konteks~baik 与 bagus 按语境选;cepat = pantas~快 → 迅速;gembira ≈ riang~开心 → 欢快;penat = letih~疲累|tolong → membantu~帮助表达更正式;cakap → berkata／menyatakan~说 → 表示，按句型;buat → melakukan／melaksanakan~做 → 进行／实施，按宾语;lihat → memerhati~看 → 观察|jaga kebersihan → menjaga kebersihan~保持卫生;kurangkan sampah → mengurangkan sisa~减少垃圾;tolong orang → membantu orang lain~帮助他人;baikkan keadaan → memperbaiki keadaan~改善情况|sangat penting → amat penting~非常重要;buat keputusan → membuat keputusan~作出决定;beri kesedaran ≠ meningkatkan kesedaran~给予意识与提高意识含义不同;buat kerjasama → menjalinkan kerjasama~建立合作|atasi masalah → menangani masalah~处理问题;kuatkan hubungan → memperkukuh hubungan~加强关系;galakkan murid → menggalakkan murid~鼓励学生;lindungi alam → melindungi alam sekitar~保护环境|memelihara budaya~维护文化;memulihara tapak warisan~保育遗址;meningkatkan kualiti hidup~提升生活质量;mengurangkan pencemaran~减少污染|pilih kata formal apabila konteks formal~正式语境选正式词;elakkan kata bombastik tanpa perlu~避免无必要夸张用词;guna kata tepat bukan sekadar sukar~用精准词而非只用难词;pastikan ayat semula jadi~确保句子自然|ketepatan makna~意义准确;ketepatan kolokasi~搭配准确;kesesuaian laras~语体合适;kejelasan hujah~论述清晰

const levels=['L1｜Tahun 1–2','L2｜Tahun 3–4 / MPT4','L3｜Tahun 5–6 / UASA','L4｜Tingkatan 1','L5｜Tingkatan 2','L6｜Tingkatan 3','L7｜Tingkatan 4 / SPM','L8｜Tingkatan 5 / SPM'];const nav=document.getElementById('nav'),content=document.getElementById('content');raw.split('\n').forEach(line=>{line=line.trim();let p=line.split('|'),id=p[0],title=p[1],cn=p[2],groups=p.slice(3);nav.insertAdjacentHTML('beforeend',`<a class="navcard" href="#${id}"><b>T29-${id.toUpperCase()}</b><span>${title}｜${cn}</span></a>`);let ds='';groups.forEach((g,i)=>{let words=g.split(';').map(x=>{let z=x.split('~');return `<div class="word"><strong>${z[0]}</strong><div>${z[1]}</div></div>`}).join('');ds+=`<details ${i===0?'open':''}><summary>${levels[i]}</summary><div class="level-content"><div class="vocab">${words}</div><div class="route"><b>重点：</b>先看词义，再看词性、搭配与语境，不机械替换。</div></div></details>`});content.insertAdjacentHTML('beforeend',`<section class="section" id="${id}"><div class="section-head"><h2>T29-${id.toUpperCase()}｜${title}</h2><p>${cn}</p></div><div class="levels">${ds}</div></section>`)});
