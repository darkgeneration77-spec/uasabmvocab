name: Add Vocabulary Search
on:
  push:
    paths:
      - '.github/scripts/add_vocab_search.py'
      - '.github/workflows/add-vocab-search.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: python .github/scripts/add_vocab_search.py
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable sitewide vocabulary search"
          git push
